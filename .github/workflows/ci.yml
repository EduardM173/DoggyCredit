name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doggycredit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d doggycredit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doggycredit_test?schema=public
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma formatting
        run: npm run prisma:format && git diff --exit-code -- prisma/schema.prisma

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API end-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
